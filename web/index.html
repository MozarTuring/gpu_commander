<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPU Commander</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="scanlines"></div>

    <header class="app-header">
        <div class="header-brand">
            <div class="brand-icon">
                <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                    <rect x="2" y="2" width="7" height="7" rx="1" fill="currentColor" opacity=".9"/>
                    <rect x="11" y="2" width="7" height="7" rx="1" fill="currentColor" opacity=".5"/>
                    <rect x="2" y="11" width="7" height="7" rx="1" fill="currentColor" opacity=".5"/>
                    <rect x="11" y="11" width="7" height="7" rx="1" fill="currentColor" opacity=".9"/>
                </svg>
            </div>
            <h1>GPU<span>Commander</span></h1>
        </div>
        <div class="header-right">
            <div class="header-status">
                <span class="status-pulse"></span>
                <span id="lastUpdated">Connecting...</span>
            </div>
        </div>
    </header>

    <div class="container">
        <nav class="tabs">
            <button class="tab active" data-tab="overview">Overview</button>
            <button class="tab" data-tab="llm">LLM Services</button>
            <button class="tab" data-tab="execute">Execute</button>
            <button class="tab" data-tab="tasks">Task Queue</button>
            <button class="tab" data-tab="settings">Settings</button>
        </nav>

        <!-- Overview Tab -->
        <div id="tab-overview" class="tab-content active">
            <div class="machines-grid" id="machinesGrid"></div>
        </div>

        <!-- LLM Services Tab -->
        <div id="tab-llm" class="tab-content">
            <div id="llmGrid"></div>
        </div>

        <!-- Execute Tab -->
        <div id="tab-execute" class="tab-content">
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-label">Execute Command</span>
                </div>
                <div class="cmd-row">
                    <select id="cmdMachine"></select>
                    <input type="text" id="cmdInput" placeholder="nvidia-smi" spellcheck="false">
                    <button id="cmdRun">Run</button>
                </div>
                <div class="cmd-output" id="cmdOutput">Output will appear here...</div>
            </div>
        </div>

        <!-- Task Queue Tab -->
        <div id="tab-tasks" class="tab-content">
            <div class="panel" style="margin-bottom:16px">
                <div class="panel-header">
                    <span class="panel-label">Submit Task</span>
                </div>
                <div class="cmd-row">
                    <select id="taskMachine"></select>
                    <input type="text" id="taskInput" placeholder="python train.py --epochs 100" spellcheck="false">
                    <button id="taskSubmit">Submit</button>
                </div>
            </div>
            <div class="panel">
                <div class="panel-header">
                    <span class="panel-label">Tasks</span>
                    <select id="taskFilterMachine" class="filter-select"></select>
                </div>
                <div id="taskTableContainer">
                    <div class="empty-state">No tasks yet</div>
                </div>
            </div>
        </div>

        <!-- Settings Tab -->
        <div id="tab-settings" class="tab-content">
            <div class="panel settings-panel">
                <div class="panel-header">
                    <span class="panel-label">HuggingFace Token</span>
                </div>
                <p class="settings-desc">
                    Required for downloading gated models (e.g. MedGemma). Stored on the coordinator machine and injected at deploy time — never committed to git.
                </p>
                <div id="hf-token-status" class="token-status">Checking...</div>
                <div class="cmd-row" style="margin-bottom:10px">
                    <input type="password" id="hf-token-input" placeholder="hf_xxxxxxxxxxxxxxxxxxxxxxxx" class="mono-input">
                    <button id="hf-token-save" onclick="saveHFToken()">Save</button>
                </div>
                <button id="hf-token-clear" class="btn-danger" onclick="clearHFToken()">Clear Token</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
</body>
</html>
