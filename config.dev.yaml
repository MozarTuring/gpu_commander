coordinator:
  host: "0.0.0.0"
  port: 9801
  poll_interval: 10  # seconds between GPU status polls
  host_machine: "custodian2ferragon"  # only this machine runs the coordinator

llm_idle:
  timeout_hours: 2      # stop a model after this many hours of inactivity
  check_interval_hours: 0.5  # how often to run the idle check

auth:
  token: "gpu-commander-secret-change-me"

# Dev coordinator runs on custodian2ferragon on port 9801.
# Access via: ssh -f -N -L 9801:localhost:9801 custodian2ferragon

machines:
  custodian2ferragon:
    host: localhost             # coordinator co-located with this agent
    agent_port: 9850
    ssh_alias: custodian2ferragon
    remote_dir: /home/custodian/project_remote_jwm/gpu_commander_dev/agent
    description: "ferragon.stellar.research.liu.se"
    vllm_service_dir: /home/custodian/project_remote_jwm/vllm_service

  custodian2greatrawr:
    host: greatrawr.stellar.research.liu.se   # direct hostname from ferragon
    agent_port: 9850
    ssh_alias: custodian2greatrawr
    remote_dir: /home/custodian/project_remote_jwm/gpu_commander_dev/agent
    description: "greatrawr.stellar.research.liu.se"
    vllm_service_dir: /home/custodian/project_remote_jwm/vllm_service
